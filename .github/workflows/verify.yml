name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  patches:
    name: Patches apply on Helium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply Heliox on top of Helium
        run: python3 scripts/verify.py
      - name: Check shell scripts
        run: bash -n install.sh uninstall.sh scripts/build.sh scripts/package.sh
